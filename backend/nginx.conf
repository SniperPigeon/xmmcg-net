# Nginx configuration for XMMCG Django Backend
# Deploy to: /etc/nginx/sites-available/xmmcg

upstream django_app {
    server unix:/run/gunicorn/xmmcg.sock fail_timeout=0;
}

server {
    listen 80;
    server_name xmmcg.example.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Must cover MAX_AUDIO_SIZE_MB + MAX_COVER_SIZE_MB + MAX_VIDEO_SIZE_MB.
    client_max_body_size 300M;

    # Backend API routes
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend - Vue SPA
    location / {
        root /var/www/xmmcg/frontend;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Access and error logs
    access_log /var/log/nginx/xmmcg_access.log;
    error_log /var/log/nginx/xmmcg_error.log;
}

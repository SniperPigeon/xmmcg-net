# 初次部署模板。已配置 HTTPS 的服务器应合并修改，不要覆盖 Certbot 配置。
upstream django_app {
    server unix:/run/gunicorn/xmmcg.sock fail_timeout=0;
}

server {
    listen 80;
    server_name xmmcg.net xmmcg.majdata.net;
    root /var/www/xmmcg/frontend;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 50M;

    # 无尾斜杠的后端入口也不能落到 Vue 的首页。
    location = /admin { return 308 /admin/$is_args$args; }
    location = /api { return 308 /api/$is_args$args; }
    location = /static { return 308 /static/$is_args$args; }

    # /static/ 由 Django 从 R2 读取；没有本地用户媒体目录。
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite 哈希资源允许长缓存；缺失资源返回 404，不能返回 HTML。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /res/ {
        try_files $uri =404;
        expires 1h;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/xmmcg_access.log;
    error_log /var/log/nginx/xmmcg_error.log;
}
